name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bauen
        run: npm run build -w web
        env:
          # Die Adresse des Workers ist öffentlich, sie ist kein Geheimnis
          VITE_API_URL: ${{ vars.READCAST_API_URL }}
          READCAST_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
